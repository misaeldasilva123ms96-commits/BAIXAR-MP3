name: Validação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Preservar contrato e sintaxe do V2
        shell: pwsh
        run: ./tests/legacy-contract.ps1
      - name: Verificar arquivos essenciais
        shell: pwsh
        run: |
          $required = @('ABRIR_MP3_DOWNLOADER.bat','Abrir_Baixador_MP3_V2.bat','Baixador_MP3_V2.ps1','README.md','SECURITY.md')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Arquivos ausentes: $($missing -join ', ')" }
