name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag versionada existente (ex.: v3.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify signed tag belongs to main
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Tag inválida.' }
          git fetch origin main --tags
          if ((git rev-parse HEAD) -ne (git rev-parse "$tag^{commit}")) { throw 'Checkout não corresponde à tag.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'A tag não pertence à main.' }
          $allowedFingerprint = '2068DBFB51168F6E8F4682D0DA2702958F751F0A'
          $publicKey = Join-Path $env:RUNNER_TEMP 'release-signing-key.asc'
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY_OWNER.gpg" -OutFile $publicKey
          $fingerprints = gpg --batch --with-colons --import-options show-only --import $publicKey |
            Where-Object { $_ -like 'fpr:*' } |
            ForEach-Object { ($_ -split ':')[9] }
          if ($allowedFingerprint -notin $fingerprints) { throw 'A chave pública não contém o assinante permitido.' }
          gpg --batch --import $publicKey
          $verification = git verify-tag --raw -- $tag 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'A assinatura da tag é inválida ou não confiável.' }
          if (-not ($verification | Where-Object { $_ -match "\[GNUPG:\] VALIDSIG $allowedFingerprint " })) { throw 'A tag não foi assinada pela identidade permitida.' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.5
          cache: true
      - name: Verify source before packaging
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm test
          go test ./services/...
          ./tests/legacy-contract.ps1
      - name: Download pinned and verified Windows tools
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1
      - name: Build release package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/build-release.ps1 -Version $version -OutputDirectory '${{ runner.temp }}/release'
          ./tests/smoke-release-package.ps1 -PackagePath "${{ runner.temp }}/release/MP3_Downloader_v${version}_Windows"
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
      - name: Publish release without replacing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Tag inválida.' }
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) { throw 'A release já existe e não será substituída.' }
          $version = $tag.Substring(1)
          gh release create $tag `
            "${{ runner.temp }}/release/MP3_Downloader_v${version}_Windows.zip" `
            "${{ runner.temp }}/release/checksums.sha256" `
            --repo $env:GITHUB_REPOSITORY --verify-tag --fail-on-no-commits --generate-notes `
            --title "MP3 Downloader $version"
