name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag versionada existente (ex.: v3.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify tag belongs to main
        shell: pwsh
        run: |
          if ('${{ env.RELEASE_TAG }}' -notmatch '^v\d+\.\d+\.\d+$') { throw 'Tag inválida.' }
          git fetch origin main --tags
          if ((git rev-parse HEAD) -ne (git rev-parse '${{ env.RELEASE_TAG }}^{commit}')) { throw 'Checkout não corresponde à tag.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'A tag não pertence à main.' }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - name: Verify source before packaging
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm test
          go test ./services/...
          ./tests/legacy-contract.ps1
      - name: Download pinned and verified Windows tools
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1
      - name: Build release package
        shell: pwsh
        run: |
          $version = '${{ env.RELEASE_TAG }}'.Substring(1)
          ./scripts/build-release.ps1 -Version $version -OutputDirectory '${{ runner.temp }}/release'
          ./tests/smoke-release-package.ps1 -PackagePath "${{ runner.temp }}/release/MP3_Downloader_v${version}_Windows"
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
      - name: Publish release without replacing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view '${{ env.RELEASE_TAG }}' --repo $env:GITHUB_REPOSITORY 2>$null) { throw 'A release já existe e não será substituída.' }
          $version = '${{ env.RELEASE_TAG }}'.Substring(1)
          gh release create '${{ env.RELEASE_TAG }}' `
            "${{ runner.temp }}/release/MP3_Downloader_v${version}_Windows.zip" `
            "${{ runner.temp }}/release/checksums.sha256" `
            --repo $env:GITHUB_REPOSITORY --verify-tag --fail-on-no-commits --generate-notes `
            --title "MP3 Downloader $version"
